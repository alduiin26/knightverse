<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnightVerse | Game Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Eski tarz MMORPG giriş ekranı karanlığı */
        .client-bg {
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
        }
        .server-box:hover .status-dot { box-shadow: 0 0 10px currentColor; }
    </style>
</head>
<body class="client-bg text-gray-300 font-sans h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Animasyonlu Arka Plan Efekti -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>

    <div class="z-10 w-full max-w-md bg-black/60 backdrop-blur-md border border-[#333] p-8 rounded-xl shadow-2xl">
        <div class="text-center mb-8">
            <img src="logoko.png" alt="KnightVerse" class="h-16 mx-auto mb-4 mix-blend-screen opacity-90">
            <h1 class="text-xl font-bold text-white uppercase tracking-widest">Select Server</h1>
            <p class="text-xs text-gray-500 mt-2">Web3 Wallet Signature Required</p>
        </div>

        <div class="space-y-3">
            <!-- Server 1 -->
            <div class="server-box bg-[#111] border border-[#222] hover:border-emerald-500/50 p-4 rounded-lg flex items-center justify-between cursor-pointer transition" onclick="alert('Signature request pending. Please wait for Alpha phase to begin.')">
                <div>
                    <h3 class="text-white font-bold text-sm">Alpha Testnet</h3>
                    <div class="text-[10px] text-gray-500 uppercase mt-0.5">Whitelist Only</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500 font-mono">OFFLINE</span>
                    <span class="status-dot w-2.5 h-2.5 rounded-full bg-red-600"></span>
                </div>
            </div>

            <!-- Server 2 -->
            <div class="server-box bg-[#111] border border-[#222] opacity-60 p-4 rounded-lg flex items-center justify-between cursor-not-allowed">
                <div>
                    <h3 class="text-gray-400 font-bold text-sm">Mainnet World</h3>
                    <div class="text-[10px] text-gray-600 uppercase mt-0.5">Phase 1 Release</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-600 font-mono">LOCKED</span>
                    <i data-lucide="lock" class="w-3 h-3 text-gray-600"></i>
                </div>
            </div>

            <!-- Server 3 -->
            <div class="server-box bg-[#111] border border-[#222] opacity-60 p-4 rounded-lg flex items-center justify-between cursor-not-allowed">
                <div>
                    <h3 class="text-gray-400 font-bold text-sm">PvP Arena</h3>
                    <div class="text-[10px] text-gray-600 uppercase mt-0.5">Wager Matches</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-600 font-mono">LOCKED</span>
                    <i data-lucide="lock" class="w-3 h-3 text-gray-600"></i>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-xs text-gray-500 hover:text-white transition">Cancel & Return Home</a>
        </div>
    </div>
    
    <script>lucide.createIcons();</script>
</body>
</html>
